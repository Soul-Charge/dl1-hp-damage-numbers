; ====================================================================
; DL1 Enemy Health Bar Numbers & Floating Damage Numbers v1.0.1
; 消逝的光芒 1 - 敌人血条精确数值 & 攻击伤害飘字模组 v1.0.1
;
; Place winmm.dll and dl1_hp_damage.ini next to DyingLightGame.exe.
; 将 winmm.dll 与 dl1_hp_damage.ini 放到游戏根目录（DyingLightGame.exe 同级）。
; ====================================================================

[General]
; Enable overlay on startup (1 = on, 0 = off) / 启动时启用覆盖层 (1=开, 0=关)
enabled=1
; UI toast language: auto (follow Windows), en (English), zh (简体中文)
; 提示语语言：auto（自动跟随系统）、en（英文）、zh（简体中文）
language=auto
; Toggle overlay hotkey (0x74 = F5) / 总开关热键 (0x74 = F5)
toggle_key=0x74
; Cycle bar mode hotkey (0x75 = F6): Custom Bar+HP -> HP Numbers Only -> Damage Only
; 切换血条模式热键 (0x75 = F6)：自定义血条+数字 -> 仅血量数字 -> 仅伤害飘字
mode_key=0x75
; Write diagnostic log to dl1_hp_damage.log / 输出诊断日志 (1=开, 0=关)
enable_log=1

[HealthBar]
; Show enemy health bars & HP numbers / 显示敌人血条与血量数字 (1=开, 0=关)
show_health_bar=1
; 1 = custom RPG health bar + HP numbers; 0 = companion mode (HP numbers only)
; 1 = 自定义 RPG 血条 + 精确血量数字；0 = 伴侣模式（仅显示血量数字，保留原版/7px血条）
draw_custom_bar=1
; Hide vanilla HudEnemyHp bar when draw_custom_bar=1 / 自定义血条开启时自动隐藏原版血条
hide_vanilla_bar=1
; Show exact HP numbers (e.g. 1989 / 4091) / 显示精确血量数字
show_hp_numbers=1
; Show percentage next to HP numbers / 附带血量百分比显示 (1=开, 0=关)
show_percent=0
; Custom bar width & height in pixels / 自定义血条宽高（像素）
bar_width=112
bar_height=9
; Vertical offset above enemy head (negative = higher) / 头顶垂直偏移（负值更高）
bar_offset_y=-18
; Max display distance in meters / 最大显示距离（米）
max_distance=35.0
; Seconds to keep showing bar after damaging an enemy / 受击后血条保留秒数
linger_seconds=4.0
; Font scale for HP numbers / 血量数字缩放倍率
hp_font_scale=0.82

[DamageNumbers]
; Show floating damage numbers on hit / 攻击命中时显示伤害飘字 (1=开, 0=关)
show_damage_numbers=1
; Popup lifetime in seconds / 伤害飘字持续时间（秒）
duration=1.15
; Upward float speed in pixels/sec / 上浮速度（像素/秒）
float_speed=62.0
; Base font scale for damage numbers / 伤害数字基础字号倍率
font_scale=1.05
; Gold heavy/crit highlight threshold (ratio of MaxHP or flat damage)
; 金色重击/暴击高亮阈值（占最大血量比例，或单次伤害达到设定值）
crit_hp_ratio=0.35
crit_min_damage=400.0
; Minimum damage to display / 最小显示伤害值
min_damage=1.0
; Append "!" on killing blows (red) / 击杀一击（红色）末尾显示 "!"
show_kill_badge=1
