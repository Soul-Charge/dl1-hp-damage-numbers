; ============================================================
; DL1 Enemy Health Bar Numbers & Floating Damage Numbers v1.0
; Place winmm.dll and dl1_hp_damage.ini in your Dying Light
; root folder (next to DyingLightGame.exe).
; ============================================================

[General]
; 1 = enabled on startup, 0 = disabled
enabled=1
; Virtual-key code to toggle the entire overlay live in-game (0x76 = F7)
toggle_key=0x76
; Virtual-key code to cycle bar mode live in-game (0x77 = F8):
;   Custom Bar + HP Numbers -> HP Numbers Only (Vanilla Bar) -> Damage Numbers Only
mode_key=0x77
; Write diagnostic log to dl1_hp_damage.log (1 = on, 0 = off)
enable_log=1

[HealthBar]
; Show enemy health bars & HP numbers (1 = on, 0 = off)
show_health_bar=1
; 1 = draw custom RPG health bar with damage-drain trail + exact HP numbers
; 0 = companion mode: draw exact HP numbers only (use with vanilla / crinloader / 7px bar)
draw_custom_bar=1
; When draw_custom_bar=1, hide the vanilla HudEnemyHp bar so there is no overlap
hide_vanilla_bar=1
; Show exact HP numbers (e.g. 420 / 500)
show_hp_numbers=1
; Also show percentage next to HP numbers (e.g. 420 / 500 (84%))
show_percent=0
; Custom bar dimensions (pixels at 1080p baseline, scales softly with distance)
bar_width=112
bar_height=9
; Vertical offset above enemy head anchor (pixels, negative = higher)
bar_offset_y=-18
; Maximum distance in meters to display enemy health bars
max_distance=35.0
; Seconds to keep showing an enemy's health bar after you damage them
linger_seconds=4.0
; Font scale for exact HP numbers
hp_font_scale=0.82

[DamageNumbers]
; Show floating damage numbers when attacking enemies (1 = on, 0 = off)
show_damage_numbers=1
; Lifetime of each floating damage number in seconds
duration=1.15
; Upward float speed in pixels/second
float_speed=62.0
; Base font scale for floating damage numbers
font_scale=1.05
; Highlight as heavy/critical (gold) if damage >= ratio of enemy max HP or >= crit_min_damage
crit_hp_ratio=0.35
crit_min_damage=400.0
; Minimum damage required to spawn a floating number
min_damage=1.0
; Append "!" on killing blows (vivid red)
show_kill_badge=1
